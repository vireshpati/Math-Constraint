  # ─────────────────────────────────────────────────────────────────
  # MathConstraint candidate pool — large set of cranked-parameter instances
  # used to source the harder MathConstraint tier. Generates pool/.
  # Internal artifact (not shipped). No hints, no partial assignments.
  # Long solver budget required.
  #
  # The shipped 329-instance MathConstraint artifact picks 249 from this pool
  # (plus 80 frontier-failed instances from MathConstraint-Easy) via
  # configs/selections/mathconstraint.txt.
  # ─────────────────────────────────────────────────────────────────
  pool:
    description: |
      MathConstraint candidate pool (~530 attempted samples, 33 types, cranked
      params). Internal artifact: feeds 249 instances into MathConstraint via
      configs/selections/mathconstraint_hard.txt. Long solver budget needed
      (MCNST_SOLVER_TIMEOUT_SEC=600+).

      Faithful description: param_domains and problem_types here cover every
      instance present in the shipped mathconstraint/ artifact. Re-running this
      profile yields a similar-character pool but does not bit-reproduce the
      exact 249 instance names — those came from a multi-iteration historical
      curation, so the live filter operates on shipped frozen artifacts rather
      than a fresh build.
