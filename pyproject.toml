[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-constraint"
version = "0.1.0"
description = "Math Constraint Satisfaction Benchmark for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pycsp3",
    "huggingface_hub>=0.25.0",
    "openai>=1.0.0",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
local = [
    "vllm>=0.6.0",
]
tracking = [
    "wandb>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
